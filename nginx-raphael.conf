server {
    listen 80;
    server_name _;

    # Agent Assistant 项目
    location /agent {
        alias /home/claudeuser/agent-assistant/client/dist;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Agent Assistant API - 保留 /api 前缀
    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 原有 Raphael's Homepage
    location / {
        root /home/claudeuser/raphael-homepage;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
